name: 桌面安装包构建与验收

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 构建平台
        type: choice
        default: win
        options: [win, linux, mac, all]
  workflow_call:
    inputs:
      sign:
        description: 使用传入的签名凭据，仅发布流程开启
        type: boolean
        default: false
    secrets:
      MAC_CSC_LINK:
        required: false
      MAC_CSC_KEY_PASSWORD:
        required: false
      MAC_DEVELOPER_ID:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: 构建 ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            inputs.platform == 'win' && '[{"os":"windows-2022","platform":"win","arch":"x64"}]' ||
            inputs.platform == 'linux' && '[{"os":"ubuntu-24.04","platform":"linux","arch":"x64"}]' ||
            inputs.platform == 'mac' && '[{"os":"macos-15","platform":"mac","arch":"arm64"}]' ||
            '[{"os":"windows-2022","platform":"win","arch":"x64"},{"os":"ubuntu-24.04","platform":"linux","arch":"x64"},{"os":"macos-15","platform":"mac","arch":"arm64"}]'
          ) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: 校验 tag 与桌面版本
        if: github.ref_type == 'tag'
        run: |
          bun run - <<'JS'
          const { version } = require('./apps/desktop/package.json');
          if (process.env.GITHUB_REF_NAME !== `desktop-v${version}`) {
            throw new Error(`tag 必须为 desktop-v${version}`);
          }
          JS
      - name: 导入 macOS 签名证书
        if: inputs.sign && runner.os == 'macOS'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [[ -z "$MAC_CSC_LINK" ]]; then exit 0; fi
          python3 - <<'PYTHON'
          import base64, os, pathlib, urllib.request
          value = os.environ['MAC_CSC_LINK']
          data = urllib.request.urlopen(value).read() if value.startswith('https://') else base64.b64decode(value)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'tarp-signing.p12').write_bytes(data)
          PYTHON
          TARP_KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          TARP_KEYCHAIN="$RUNNER_TEMP/tarp-signing.keychain-db"
          security create-keychain -p "$TARP_KEYCHAIN_PASSWORD" "$TARP_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$TARP_KEYCHAIN"
          security unlock-keychain -p "$TARP_KEYCHAIN_PASSWORD" "$TARP_KEYCHAIN"
          security import "$RUNNER_TEMP/tarp-signing.p12" -k "$TARP_KEYCHAIN" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$TARP_KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$TARP_KEYCHAIN_PASSWORD" "$TARP_KEYCHAIN"
      - name: 构建安装包
        working-directory: apps/desktop
        env:
          TARP_CODESIGN: ${{ matrix.platform == 'mac' && '1' || '0' }}
          TARP_NOTARIZE: ${{ inputs.sign && secrets.MAC_DEVELOPER_ID != '' && secrets.APPLE_ID != '' && matrix.platform == 'mac' && '1' || '0' }}
          ELECTROBUN_DEVELOPER_ID: ${{ matrix.platform == 'mac' && (inputs.sign && secrets.MAC_DEVELOPER_ID || '-') || '' }}
          ELECTROBUN_APPLEID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          ELECTROBUN_APPLEIDPASS: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          ELECTROBUN_TEAMID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
        run: bun run dist
      - name: 校验 macOS DMG 与内部安装器签名
        if: runner.os == 'macOS'
        run: |
          codesign --verify --strict --verbose=2 apps/desktop/release/macos-arm64-TARP.dmg
          TARP_DMG_MOUNT=$(mktemp -d "$RUNNER_TEMP/tarp-dmg.XXXXXX")
          hdiutil attach apps/desktop/release/macos-arm64-TARP.dmg -readonly -nobrowse -mountpoint "$TARP_DMG_MOUNT"
          trap 'hdiutil detach "$TARP_DMG_MOUNT"; rmdir "$TARP_DMG_MOUNT"' EXIT
          codesign --verify --deep --strict --verbose=2 "$TARP_DMG_MOUNT/TARP.app"
      - name: 验证打包后的 Bun、CLI、模组、Wasm 和 SQLite
        run: bun scripts/release/smoke.ts desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.tar.zst
            apps/desktop/release/*.tar.gz
            apps/desktop/release/*.json
            apps/desktop/release/*.patch
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
